<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Saarthi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .map-grid {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    }
    #map-canvas { display: block; width: 100%; height: 100%; }
    .status-ok   { background: rgba(34,197,94,0.12) !important; color: #4ade80 !important; border-color: rgba(34,197,94,0.25) !important; }
    .status-error{ background: rgba(239,68,68,0.12) !important; color: #f87171 !important; border-color: rgba(239,68,68,0.25) !important; }
    .status-ok   .status-dot { background:#22c55e; box-shadow:0 0 6px #22c55e; animation:none; }
    .status-error .status-dot{ background:#ef4444; box-shadow:0 0 6px #ef4444; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
    .status-error .status-dot { animation: pulse-dot .9s ease-in-out infinite; }
    @keyframes mic-ring {
      from { box-shadow: 0 0 0 0 rgba(59,130,246,.5); }
      to   { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
    }
    #voice-btn.recording { border-color: #3b82f6 !important; background: rgba(59,130,246,.08) !important; }
    #voice-btn.recording .mic-dot { animation: mic-ring .7s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen p-4">

  <!-- Phone shell -->
  <div class="bg-[#0B0F19] w-full max-w-[400px] rounded-[2.5rem] shadow-2xl border border-gray-800/60 overflow-hidden flex flex-col" style="height:850px">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 pt-8 pb-3 flex-shrink-0">
      <div class="text-2xl font-bold tracking-tight text-white">Saar<span class="text-blue-500">thi</span></div>
      <div class="flex items-center space-x-2 text-xs font-semibold flex-shrink-0">
        <div class="bg-gray-800/80 text-gray-300 px-3 py-1.5 rounded-full border border-gray-700/50 whitespace-nowrap" id="speed-text">0 m/s</div>
        <div id="status-pill" class="status-error px-3 py-1.5 rounded-full border border-red-900/50 flex items-center space-x-1.5 whitespace-nowrap">
          <span class="status-dot w-2 h-2 rounded-full flex-shrink-0"></span>
          <span id="status-text">Connecting</span>
        </div>
      </div>
    </div>

    <!-- Scrollable body -->
    <div class="flex-1 overflow-y-auto px-6 space-y-5 pb-4" style="min-height:0">

      <!-- Map -->
      <div class="space-y-2">
        <h2 class="text-xs font-bold text-gray-500 tracking-widest uppercase">Live Map</h2>
        <div class="relative w-full rounded-3xl border border-gray-800 overflow-hidden map-grid bg-gray-900" style="height:240px">
          <canvas id="map-canvas"></canvas>
          <div id="map-overlay-msg" class="absolute inset-0 flex items-center justify-center text-xs text-gray-600 pointer-events-none">
            Waiting for map…
          </div>
        </div>
      </div>

      <!-- Destinations -->
      <div class="space-y-2">
        <h2 class="text-xs font-bold text-gray-500 tracking-widest uppercase">Navigate To</h2>
        <div class="grid grid-cols-2 gap-3">

          <button data-dest="kitchen" aria-label="Navigate to Kitchen"
            class="dest-btn bg-[#131824] hover:bg-[#1a2133] border border-gray-800/60 rounded-2xl p-4 text-left flex flex-col justify-between transition-all active:scale-95 h-28">
            <div class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-lg">🍳</div>
            <div>
              <div class="text-white font-semibold text-sm">Kitchen</div>
              <div class="text-gray-500 text-xs mt-0.5">Room 1</div>
            </div>
          </button>

          <button data-dest="classroom" aria-label="Navigate to Classroom"
            class="dest-btn bg-[#131824] hover:bg-[#1a2133] border border-gray-800/60 rounded-2xl p-4 text-left flex flex-col justify-between transition-all active:scale-95 h-28">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-lg">📚</div>
            <div>
              <div class="text-white font-semibold text-sm">Classroom</div>
              <div class="text-gray-500 text-xs mt-0.5">Room 2</div>
            </div>
          </button>

          <button data-dest="bedroom" aria-label="Navigate to Bedroom"
            class="dest-btn bg-[#131824] hover:bg-[#1a2133] border border-gray-800/60 rounded-2xl p-4 text-left flex flex-col justify-between transition-all active:scale-95 h-28">
            <div class="w-10 h-10 rounded-xl bg-purple-500/10 flex items-center justify-center text-lg">🛏️</div>
            <div>
              <div class="text-white font-semibold text-sm">Bedroom</div>
              <div class="text-gray-500 text-xs mt-0.5">Room 3</div>
            </div>
          </button>

          <button data-dest="bathroom" aria-label="Navigate to Bathroom"
            class="dest-btn bg-[#131824] hover:bg-[#1a2133] border border-gray-800/60 rounded-2xl p-4 text-left flex flex-col justify-between transition-all active:scale-95 h-28">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/10 flex items-center justify-center text-lg">🚿</div>
            <div>
              <div class="text-white font-semibold text-sm">Bathroom</div>
              <div class="text-gray-500 text-xs mt-0.5">Room 4</div>
            </div>
          </button>

        </div>
      </div>
    </div>

    <!-- Sticky bottom actions -->
    <div class="px-6 pb-8 pt-3 flex-shrink-0 space-y-3" style="background:linear-gradient(to bottom, transparent, #0B0F19 30%)">

      <button id="stop-btn" aria-label="Emergency stop"
        class="w-full bg-gradient-to-r from-red-500 to-red-600 hover:from-red-400 hover:to-red-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.98] flex items-center justify-center space-x-3"
        style="box-shadow:0 8px 30px rgba(220,38,38,0.25)">
        <div class="w-4 h-4 bg-white/20 rounded-sm flex-shrink-0"></div>
        <span class="tracking-wide text-[15px]">EMERGENCY STOP</span>
      </button>

      <button id="voice-btn" aria-label="Hold to speak destination" touch-action="none"
        class="w-full bg-[#131824] border border-gray-800 text-white font-semibold py-4 rounded-2xl transition-all active:scale-[0.98] flex items-center justify-center space-x-3">
        <div class="mic-dot w-3.5 h-3.5 bg-blue-500 rounded-full flex-shrink-0" style="box-shadow:0 0 10px rgba(59,130,246,.5)"></div>
        <span class="text-[15px]">Hold &amp; Speak</span>
      </button>

      <div id="voice-hint" class="text-center text-xs text-gray-600 min-h-[16px] opacity-0 transition-opacity duration-300" aria-live="polite"></div>
    </div>

  </div>

<script src="/static/app.js"></script>
</body>
</html>
